<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="3D Cost">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <title>3D Print Quote Calculator</title>
  <style>
    :root {
      --page: #f5f7f4;
      --surface: #ffffff;
      --surface-soft: #f8faf7;
      --text: #17201d;
      --muted: #63706b;
      --line: #dce4df;
      --primary: #0f766e;
      --primary-dark: #0a554f;
      --primary-soft: #e1f4ef;
      --accent: #d97706;
      --danger: #b42318;
      --shadow: 0 16px 38px rgba(23, 32, 29, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .app {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 0 calc(36px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--primary-dark);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.55rem, 7vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .summary {
      position: sticky;
      top: 0;
      z-index: 2;
      border: 1px solid rgba(15, 118, 110, 0.22);
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .summary-label {
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .quote-total {
      margin: 2px 0 12px;
      color: #ffffff;
      font-size: clamp(3rem, 17vw, 5rem);
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-chip {
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
    }

    .summary-chip strong {
      display: block;
      font-size: 1.04rem;
      font-variant-numeric: tabular-nums;
    }

    .summary-chip span {
      display: block;
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.06rem;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: #27312d;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .hint {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 11px 13px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    input::placeholder {
      color: #9aa6a1;
    }

    input:hover,
    select:hover {
      border-color: #bfcbc5;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
    }

    details {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      margin-bottom: 16px;
      overflow: hidden;
    }

    summary {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-weight: 900;
    }

    details[open] summary::after {
      content: "-";
    }

    .details-body {
      border-top: 1px solid var(--line);
      padding: 18px;
    }

    .breakdown {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding: 9px 0;
      color: var(--muted);
      font-weight: 750;
    }

    .row strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .row.total {
      border-bottom: 0;
      color: var(--text);
      font-size: 1.05rem;
    }

    .upload-box {
      display: grid;
      gap: 12px;
      border: 1px dashed rgba(15, 118, 110, 0.35);
      border-radius: 16px;
      background: var(--primary-soft);
      padding: 14px;
    }

    input[type="file"] {
      min-height: auto;
      border: 0;
      background: #ffffff;
    }

    .preview {
      display: none;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #ffffff;
      padding: 8px;
      overflow: hidden;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      font-weight: 900;
      padding: 11px 16px;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-button {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 14px 28px rgba(15, 118, 110, 0.22);
    }

    .secondary-button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
    }

    .install-button {
      display: none;
      grid-column: 1 / -1;
      border: 1px solid rgba(15, 118, 110, 0.18);
      background: var(--primary-soft);
      color: var(--primary-dark);
      box-shadow: none;
    }

    .install-button.is-visible {
      display: block;
    }

    .status {
      grid-column: 1 / -1;
      min-height: 22px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .error {
      color: var(--danger);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 20px, 760px);
        padding-top: calc(12px + env(safe-area-inset-top));
      }

      .topbar {
        margin-bottom: 10px;
      }

      .summary {
        position: static;
        border-radius: 20px;
        padding: 18px;
      }

      .card,
      details {
        border-radius: 18px;
      }

      .card {
        padding: 16px;
      }

      .grid,
      .summary-grid,
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="captureArea">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">3D print quote</p>
        <h1>Quick customer pricing</h1>
      </div>
    </header>

    <section class="summary" aria-live="polite">
      <p class="summary-label">Customer quote</p>
      <div class="quote-total" id="customerQuoteTotal">₹0.00</div>
      <div class="summary-grid">
        <div class="summary-chip">
          <strong id="yourCostTotal">₹0.00</strong>
          <span>Your cost</span>
        </div>
        <div class="summary-chip">
          <strong id="quoteProfit">₹0.00</strong>
          <span>Profit</span>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="printDetails">
      <h2 id="printDetails">Print Details</h2>
      <div class="grid">
        <div class="field full">
          <label for="fileName">File name</label>
          <input id="fileName" type="text" placeholder="Example: phone-stand" autocomplete="off">
        </div>

        <div class="field">
          <label for="filamentType">Filament</label>
          <select id="filamentType">
            <option value="PLA">PLA - Standard</option>
            <option value="PETG">PETG - Strong</option>
            <option value="ABS">ABS - Heat resistant</option>
            <option value="TPU">TPU - Flexible</option>
            <option value="NYLON">Nylon - Engineering</option>
          </select>
        </div>

        <div class="field">
          <label for="filamentUsed">Filament used <span class="hint">grams</span></label>
          <input id="filamentUsed" type="number" min="0" step="0.01" value="2" inputmode="decimal">
        </div>

        <div class="field">
          <label for="hours">Hours</label>
          <input id="hours" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>

        <div class="field">
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" min="0" max="59" step="1" value="15" inputmode="numeric">
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="customerPricing">
      <h2 id="customerPricing">Customer Pricing</h2>
      <div class="grid">
        <div class="field">
          <label for="marginPercent">Profit margin <span class="hint">%</span></label>
          <input id="marginPercent" type="number" min="0" step="0.01" value="40" inputmode="decimal">
        </div>

        <div class="field">
          <label for="minimumQuote">Minimum quote <span class="hint">₹</span></label>
          <input id="minimumQuote" type="number" min="0" step="0.01" value="50" inputmode="decimal">
        </div>

        <div class="field full">
          <label for="discountAmount">Discount <span class="hint">optional ₹</span></label>
          <input id="discountAmount" type="number" min="0" step="0.01" value="0" inputmode="decimal">
        </div>
      </div>
    </section>

    <details>
      <summary>Cost settings</summary>
      <div class="details-body">
        <div class="grid">
          <div class="field">
            <label for="filamentCost">Filament cost <span class="hint">per 1000g</span></label>
            <input id="filamentCost" type="number" min="0" step="0.01" value="1000" inputmode="decimal">
          </div>

          <div class="field">
            <label for="machineRate">Machine rate <span class="hint">per hour</span></label>
            <input id="machineRate" type="number" min="0" step="0.01" value="20" inputmode="decimal">
          </div>

          <div class="field">
            <label for="electricityRate">Electricity <span class="hint">per kWh</span></label>
            <input id="electricityRate" type="number" min="0" step="0.01" value="8" inputmode="decimal">
          </div>

          <div class="field">
            <label for="printerWatts">Printer power <span class="hint">watts</span></label>
            <input id="printerWatts" type="number" min="0" step="1" value="120" inputmode="numeric">
          </div>

          <div class="field full">
            <label for="extraCost">Extra cost <span class="hint">optional ₹</span></label>
            <input id="extraCost" type="number" min="0" step="0.01" value="0" inputmode="decimal">
          </div>
        </div>
      </div>
    </details>

    <details open>
      <summary>Breakdown</summary>
      <div class="details-body">
        <div class="breakdown">
          <div class="row">
            <span>Filament</span>
            <strong id="filamentTotal">₹0.00</strong>
          </div>
          <div class="row">
            <span>Electricity</span>
            <strong id="electricityTotal">₹0.00</strong>
          </div>
          <div class="row">
            <span>Machine</span>
            <strong id="machineTotal">₹0.00</strong>
          </div>
          <div class="row">
            <span>Extra</span>
            <strong id="extraTotal">₹0.00</strong>
          </div>
          <div class="row total">
            <span>Your cost</span>
            <strong id="grandTotal">₹0.00</strong>
          </div>
          <div class="row">
            <span>Base cost</span>
            <strong id="quoteBaseCost">₹0.00</strong>
          </div>
          <div class="row">
            <span>Discount</span>
            <strong id="quoteDiscount">-₹0.00</strong>
          </div>
          <div class="row">
            <span>Minimum adjustment</span>
            <strong id="quoteMinimumAdjustment">₹0.00</strong>
          </div>
        </div>
      </div>
    </details>

    <details>
      <summary>Screenshot</summary>
      <div class="details-body">
        <div class="upload-box">
          <label for="screenshot">Attach slicer screenshot</label>
          <input id="screenshot" type="file" accept="image/*">
          <div class="preview" id="preview">
            <img id="previewImage" alt="Uploaded screenshot preview">
          </div>
        </div>
      </div>
    </details>

    <section class="card">
      <div class="actions">
        <button id="captureButton" class="primary-button" type="button">Save Screenshot</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
        <button id="installButton" class="install-button" type="button">Install App</button>
        <span class="status" id="status"></span>
      </div>
    </section>
  </main>

  <script src="assets/plugins/html2canvas.min.js"></script>
  <script>
    const fields = {
      fileName: document.getElementById('fileName'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      filamentType: document.getElementById('filamentType'),
      filamentCost: document.getElementById('filamentCost'),
      filamentUsed: document.getElementById('filamentUsed'),
      electricityRate: document.getElementById('electricityRate'),
      printerWatts: document.getElementById('printerWatts'),
      machineRate: document.getElementById('machineRate'),
      extraCost: document.getElementById('extraCost'),
      marginPercent: document.getElementById('marginPercent'),
      minimumQuote: document.getElementById('minimumQuote'),
      discountAmount: document.getElementById('discountAmount')
    };

    const outputs = {
      filamentTotal: document.getElementById('filamentTotal'),
      electricityTotal: document.getElementById('electricityTotal'),
      machineTotal: document.getElementById('machineTotal'),
      extraTotal: document.getElementById('extraTotal'),
      grandTotal: document.getElementById('grandTotal'),
      yourCostTotal: document.getElementById('yourCostTotal'),
      quoteProfit: document.getElementById('quoteProfit'),
      customerQuoteTotal: document.getElementById('customerQuoteTotal'),
      quoteBaseCost: document.getElementById('quoteBaseCost'),
      quoteDiscount: document.getElementById('quoteDiscount'),
      quoteMinimumAdjustment: document.getElementById('quoteMinimumAdjustment')
    };

    const status = document.getElementById('status');
    const captureButton = document.getElementById('captureButton');
    const resetButton = document.getElementById('resetButton');
    const installButton = document.getElementById('installButton');
    const screenshotInput = document.getElementById('screenshot');
    const preview = document.getElementById('preview');
    const previewImage = document.getElementById('previewImage');
    const storageKey = 'threeDPrintCostCalculatorDraft';
    const filamentRates = {
      PLA: 1000,
      PETG: 1300,
      ABS: 1200,
      TPU: 2200,
      NYLON: 3000
    };
    let deferredInstallPrompt;

    function numberFrom(input) {
      const value = Number.parseFloat(input.value);
      return Number.isFinite(value) && value > 0 ? value : 0;
    }

    function formatINR(value) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function sanitizeFileName(value) {
      const cleaned = value.trim().replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-');
      return cleaned || '3d-print-quote';
    }

    function saveDraft() {
      const draft = Object.fromEntries(
        Object.entries(fields).map(([key, field]) => [key, field.value])
      );
      localStorage.setItem(storageKey, JSON.stringify(draft));
    }

    function restoreDraft() {
      const saved = localStorage.getItem(storageKey);
      if (!saved) {
        return;
      }

      try {
        const draft = JSON.parse(saved);
        Object.entries(draft).forEach(([key, value]) => {
          if (fields[key]) {
            fields[key].value = value;
          }
        });
      } catch (error) {
        localStorage.removeItem(storageKey);
      }
    }

    function calculateCost() {
      const hours = numberFrom(fields.hours);
      const minutes = Math.min(numberFrom(fields.minutes), 59);
      const filamentUsed = numberFrom(fields.filamentUsed);
      const durationHours = hours + (minutes / 60);
      const gramRate = numberFrom(fields.filamentCost) / 1000;
      const filamentTotal = gramRate * filamentUsed;
      const electricityTotal = durationHours * (numberFrom(fields.printerWatts) / 1000) * numberFrom(fields.electricityRate);
      const machineTotal = durationHours * numberFrom(fields.machineRate);
      const extraTotal = numberFrom(fields.extraCost);
      const grandTotal = filamentTotal + electricityTotal + machineTotal + extraTotal;
      const profitAmount = grandTotal * (numberFrom(fields.marginPercent) / 100);
      const discountAmount = Math.min(numberFrom(fields.discountAmount), grandTotal + profitAmount);
      const quotedBeforeMinimum = grandTotal + profitAmount - discountAmount;
      const minimumQuote = numberFrom(fields.minimumQuote);
      const finalQuote = Math.max(quotedBeforeMinimum, minimumQuote);
      const minimumAdjustment = Math.max(minimumQuote - quotedBeforeMinimum, 0);

      outputs.filamentTotal.textContent = formatINR(filamentTotal);
      outputs.electricityTotal.textContent = formatINR(electricityTotal);
      outputs.machineTotal.textContent = formatINR(machineTotal);
      outputs.extraTotal.textContent = formatINR(extraTotal);
      outputs.grandTotal.textContent = formatINR(grandTotal);
      outputs.yourCostTotal.textContent = formatINR(grandTotal);
      outputs.quoteProfit.textContent = formatINR(profitAmount);
      outputs.customerQuoteTotal.textContent = formatINR(finalQuote);
      outputs.quoteBaseCost.textContent = formatINR(grandTotal);
      outputs.quoteDiscount.textContent = `-${formatINR(discountAmount)}`;
      outputs.quoteMinimumAdjustment.textContent = formatINR(minimumAdjustment);
      saveDraft();
    }

    async function takeScreenshot() {
      status.className = 'status';

      if (!window.html2canvas) {
        status.textContent = 'Screenshot library could not load. Please check internet connection.';
        status.classList.add('error');
        return;
      }

      status.textContent = 'Preparing screenshot...';
      captureButton.disabled = true;

      try {
        const canvas = await html2canvas(document.getElementById('captureArea'), {
          backgroundColor: '#f5f7f4',
          scale: Math.min(window.devicePixelRatio || 1, 2)
        });
        const link = document.createElement('a');
        link.download = `${sanitizeFileName(fields.fileName.value)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        status.textContent = 'Screenshot saved.';
      } catch (error) {
        status.textContent = 'Unable to create screenshot in this browser.';
        status.classList.add('error');
      } finally {
        captureButton.disabled = false;
      }
    }

    function resetCalculator() {
      fields.fileName.value = '';
      fields.hours.value = '0';
      fields.minutes.value = '15';
      fields.filamentType.value = 'PLA';
      fields.filamentCost.value = '1000';
      fields.filamentUsed.value = '2';
      fields.electricityRate.value = '8';
      fields.printerWatts.value = '120';
      fields.machineRate.value = '20';
      fields.extraCost.value = '0';
      fields.marginPercent.value = '40';
      fields.minimumQuote.value = '50';
      fields.discountAmount.value = '0';
      screenshotInput.value = '';
      preview.style.display = 'none';
      previewImage.removeAttribute('src');
      status.textContent = '';
      localStorage.removeItem(storageKey);
      calculateCost();
    }

    Object.values(fields).forEach((field) => {
      field.addEventListener('input', calculateCost);
    });

    fields.filamentType.addEventListener('change', () => {
      fields.filamentCost.value = filamentRates[fields.filamentType.value] || filamentRates.PLA;
      calculateCost();
    });

    screenshotInput.addEventListener('change', () => {
      const file = screenshotInput.files && screenshotInput.files[0];
      if (!file) {
        preview.style.display = 'none';
        previewImage.removeAttribute('src');
        return;
      }

      previewImage.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    });

    captureButton.addEventListener('click', takeScreenshot);
    resetButton.addEventListener('click', resetCalculator);
    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) {
        return;
      }

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.classList.remove('is-visible');
    });

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.classList.add('is-visible');
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      installButton.classList.remove('is-visible');
      status.textContent = 'App installed.';
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          status.textContent = 'Offline mode could not start in this browser.';
          status.classList.add('error');
        });
      });
    }

    restoreDraft();
    calculateCost();
  </script>
</body>
</html>
